[tool.poetry]
name = "lol_dto"
version = "2.0.0"
description = "A unified representation of League of Legends-related information"
authors = ["mrtolkien <gary.mialaret+pypi@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
lol-id-tools = { version = "^1.7.1", optional = true }

[tool.poetry.extras]
names = ["lol-id-tools"]

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
tox = "^4.0"
black = "^26.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# Blanck Tox config file, but there are no tests at the moment
[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = true
envlist = py310, py311, py312, py313

[testenv]
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run pytest tests/
"""
